services:
  postgres:
    image: postgres:16-alpine
    container_name: ar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arlab
    ports:
      - "5432:5432"
    volumes:
      - ar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ar_pgdata:
